<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞義理解練習 - 中文科電子教材</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #4caf50;
            --error-color: #f44336;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #quiz-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10    px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .progress {
            text-align: right;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #fff;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
        }

        .option-btn.correct {
            background-color: var(--success-control);
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
        }

        #result-area {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            min-height: 1.5em;
        }

        .score-screen {
            text-align: center;
        }

        .restart-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .restart-btn:hover {
            background-color: #357abd;
        }

        /* 隱藏動畫 */
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="quiz-container">
    <h1>詞義理解練習</h1>
    
    <!-- 答題介面 -->
    <div id="question-screen">
        <div class="progress" id="progress">題目 1 / 10</div>
        <div class="question" id="question-text">載入中...</div>
        <div class="options-grid" id="options-container">
            <!-- 按鈕會由 JS 生成 -->
        </div>
        <div id="result-area"></div>
    </div>

    <!-- 結算介面 -->
    <div id="score-screen" class="hidden">
        <h2>練習結束！</h2>
        <p style="font-size: 1.5rem;">您的得分：<span id="final-score">0</span> / 10</p>
        <button class="restart-btn" onclick="resetQuiz()">重新挑戰</button>
    </div>
</div>

<script>
    // 題目數據庫
        // 更新後的題目數據庫 (包含第 31 至 40 題)
    // 更新後的題目數據庫 (包含第 41 至 45 題)
    const quizData = [
        { q: "電腦接收到正確的__________後，才開始執行預設的程式。", a: "指令", choices: ["指令", "命令", "要求", "任務"] },
        { q: "這座獎盃是全隊成員多年辛勤訓練與汗水的__________。", a: "結晶", choices: ["結晶", "結果", "成效", "果實"] },
        { q: "升級硬體之後，這台伺服器的運算__________得到了顯著提升。", a: "效能", choices: ["效能", "功能", "能力", "效果"] },
        { q: "經過長期的基本功練習，他的手指在鋼琴鍵盤上移動得__________。", a: "靈活自如", choices: ["靈活自如", "輕快有力", "流暢無礙", "敏捷迅速"] },
        { q: "這家品牌一向以產品__________穩定、耐用而聞名於世。", a: "品質", choices: ["品質", "水準", "素質", "特色"] },
        { q: "隨著人工智慧__________的飛速發展，許多傳統產業正在經歷轉型。", a: "技術", choices: ["技術", "方法", "手段", "能力"] },
        { q: "在進行物理實驗時，必須精確地測量物體的__________。", a: "質量", choices: ["質量", "重量", "大小", "長度"] },
        { q: "看電影、聽音樂是許多人繁忙生活中的一種__________方式。", a: "娛樂", choices: ["娛樂", "休閒", "遊戲", "消遣"] },
        { q: "這場驚險刺激的賽車比賽，為全場觀眾帶來了極大的視覺__________。", a: "刺激", choices: ["刺激", "激動", "震撼", "感官"] },
        { q: "地質學家前往偏遠的山區進行實地__________，尋找珍貴的礦石。", a: "考察", choices: ["考察", "研究", "調查", "觀察"] },
        { q: "醫生說，這種新型抗生素對治療細菌感染非常__________。", a: "有效", choices: ["有效", "有益", "有力", "有用"] },
        { q: "為了提升團隊的專業素養，公司為每位員工安排了系統化的__________課程。", a: "培訓", choices: ["培訓", "教導", "訓練", "指導"] },
        { q: "透過這次的實地考察，我們對當地的生態環境有了更深刻的__________。", a: "了解", choices: ["了解", "知道", "理解", "感悟"] },
        { q: "在傳統文化中，後輩應該__________長輩，並學習他們的優良品德。", a: "尊敬", choices: ["尊敬", "尊重", "敬佩", "愛戴"] },
        { q: "那隻小狗非常__________，只要聽到食物袋的聲音就會立刻衝過來。", a: "貪吃", choices: ["貪吃", "喜愛", "渴望", "饞嘴"] }
    ];





    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let canAnswer = true;

    // 初始化/重置測驗
    function resetQuiz() {
        // 隨機打亂題目順序
        currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        document.getElementById('score-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('result-area').innerText = "";
        
        showQuestion();
    }

    // 顯示題目
    function showQuestion() {
        canAnswer = true;
        const data = currentQuestions[currentIndex];
        
        // 更新進度
        document.getElementById('progress').innerText = `題目 ${currentIndex + 1} / ${currentQuestions.length}`;
        
        // 更新題目文本
        document.getElementById('question-text').innerText = data.q;
        
        // 準備選項並隨機化
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const shuffledChoices = [...data.choices].sort(() => Math.random() - 0.5);
        
        shuffledChoices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = choice;
            btn.onclick = () => checkAnswer(choice, btn);
            optionsContainer.appendChild(btn);
        });
    }

    // 檢查答案
    function checkAnswer(selected, btn) {
        if (!canAnswer) return;
        canAnswer = false;

        const correctAnswer = currentQuestions[currentIndex].a;
        const resultArea = document.getElementById('result-area');

        if (selected === correctAnswer) {
            score++;
            btn.classList.add('correct');
            resultArea.style.color = 'var(--success-color)';
            resultArea.innerText = "答對了！";
        } else {
            btn.classList.add('wrong');
            resultArea.style.color = 'var(--error-color)';
            resultArea.innerText = `可惜，正確答案是「${correctAnswer}」`;
            
            // 強制標示出正確的按鈕
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                if (b.innerText === correctAnswer) b.classList.add('correct');
            });
        }

        // 延遲進入下一題
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                resultArea.innerText = "";
                showQuestion();
            } else {
                showScore();
            }
        }, 1500);
    }

    // 顯示最終分數
    function showScore() {
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }

    // 啟動測驗
    resetQuiz();

</script>

</body>
</html>
