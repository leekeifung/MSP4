<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>景色優美的形容詞｜填空與聽寫</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.6;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto 2rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(15,23,42,0.08);
      padding: 1.15rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.5rem; font-weight: 800; }
    h2 { margin: 1.1rem 0 0.5rem; font-size: 1.2rem; font-weight: 800; color: #0f172a; }
    .sub { margin: 0 0 1rem; color: #475569; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin: 0.6rem 0 0.9rem;
    }
    label { font-size: 0.95rem; color: #334155; }
    select, button {
      font-size: 0.95rem;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    button {
      border: none;
      background: #e2e8f0;
      color: #0f172a;
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }
    button.primary { background: #2563eb; color: #fff; box-shadow: 0 6px 14px rgba(37,99,235,0.2); }
    button.play { background: #22c55e; color: #fff; box-shadow: 0 6px 14px rgba(34,197,94,0.2); }
    button.stop { background: #f97316; color: #fff; box-shadow: 0 6px 14px rgba(249,115,22,0.2); }
    button.warn { background: #f59e0b; color: #fff; box-shadow: 0 6px 14px rgba(245,158,11,0.25); }
    button:active { transform: translateY(1px); box-shadow: none; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: #0369a1;
      font-size: 0.92rem;
    }
    .pill.warn { background: #fef9c3; border-color: #fcd34d; color: #a16207; }
    .section-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.85rem;
      margin-top: 0.75rem;
      background: #fff;
      box-shadow: 0 6px 14px rgba(15,23,42,0.05);
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    input[type="text"] {
      width: 100%;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0.6rem;
      font-size: 1rem;
      background: #fff;
    }
    .answer {
      margin-top: 0.35rem;
      padding: 0.5rem 0.65rem;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      color: #0f172a;
      display: none;
    }
    .item-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.65rem;
      background: #fff;
      box-shadow: 0 4px 10px rgba(15,23,42,0.04);
      margin-bottom: 0.55rem;
    }
    .item-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      justify-content: space-between;
    }
    .hint { color: #64748b; font-size: 0.95rem; }
    @media (max-width: 640px) {
      .controls { flex-direction: column; align-items: flex-start; }
      .row { flex-direction: column; align-items: flex-start; }
      .item-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>景色優美的形容詞｜填空與聽寫</h1>
    <p class="sub">若未出聲，請先點擊頁面；部分 iOS／瀏覽器需用戶互動後才可播放語音。</p>

    <!-- 全域語速與語音啟用 -->
    <div class="controls">
      <label>語速：
        <select id="rateSelect">
          <option value="0.3">0.30×</option>
          <option value="0.5">0.50×</option>
          <option value="0.6">0.60×</option>
          <option value="0.9" selected>0.90×</option>
          <option value="0.95">0.95×</option>
          <option value="1.0">1.00×</option>
          <option value="1.05">1.05×</option>
        </select>
      </label>
      <button id="voiceInitBtn" class="warn">🔈 啟用語音</button>
      <button id="stopBtn" class="stop">⏹ 停止語音</button>
      <span id="voiceStatus" class="pill warn">若未出聲，請先點擊頁面（iOS 需互動啟動音訊）。</span>
    </div>

    <!-- 單一部分：景色優美形容詞填空 -->
    <div class="section-card">
      <h2>填空與聽寫</h2>
      <p class="sub">提示（近義／意涵／1–2 字提示／首尾提示），填入完整詞語；可播放答案，顯示單題或全部答案；可重排並重新抽提示。</p>
      <div class="controls">
        <button id="shuffleP4">🔀 重排並重抽提示</button>
        <button id="playAllP4" class="play">🔊 播放全部答案</button>
        <button id="checkP4" class="primary">✅ 批改本部分</button>
        <button id="showAllAnsP4">👀 顯示全部答案</button>
        <button id="resetP4">♻️ 重設本部分</button>
        <span id="statusP4" class="pill">尚未批改。</span>
      </div>
      <div id="p4List"></div>
    </div>
  </div>

  <script>
    /******** 語音工具 ********/
    const rateSelect = document.getElementById("rateSelect");
    const voiceStatus = document.getElementById("voiceStatus");
    const voiceInitBtn = document.getElementById("voiceInitBtn");
    const stopBtn = document.getElementById("stopBtn");

    let voiceReady = false, warmupRunning = false;
    let cachedVoices = [], selectedVoice = null;
    const wait = ms => new Promise(res => setTimeout(res, ms));

    function setVoiceStatus(text, ok) {
      voiceStatus.textContent = text;
      voiceStatus.classList.toggle("warn", !ok);
    }
    function pickVoice(list) {
      if (!list || !list.length) return null;
      const prefs = ["zh-TW","zh-HK","zh-CN","zh"];
      for (const p of prefs) {
        const v = list.find(v => (v.lang||"").toLowerCase().startsWith(p.toLowerCase()));
        if (v) return v;
      }
      return list[0];
    }
    function loadVoicesOnce() {
      const v = speechSynthesis.getVoices();
      if (v && v.length) {
        cachedVoices = v;
        selectedVoice = pickVoice(v);
      }
    }
    async function ensureVoices(maxTries=6, delay=250) {
      loadVoicesOnce();
      if (cachedVoices.length) return cachedVoices;
      for (let i=0;i<maxTries;i++){
        await wait(delay);
        const v = speechSynthesis.getVoices();
        if (v && v.length){
          cachedVoices = v;
          selectedVoice = pickVoice(v);
          return v;
        }
      }
      return cachedVoices;
    }
    async function warmupVoice({ silentUpdate=false } = {}) {
      if (warmupRunning) return;
      warmupRunning = true;
      if (!("speechSynthesis" in window)) {
        setVoiceStatus("此瀏覽器不支援語音。", false);
        warmupRunning = false; return;
      }
      await ensureVoices();
      const u = new SpeechSynthesisUtterance("。");
      u.lang = selectedVoice?.lang || "zh-TW";
      if (selectedVoice) u.voice = selectedVoice;
      u.rate = 1;
      const done = new Promise(res => { u.onend=res; u.onerror=res; });
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      await done;
      voiceReady = true;
      warmupRunning = false;
      if (!silentUpdate) setVoiceStatus("語音已就緒，可播放。", true);
    }
    function getRate(){ return parseFloat(rateSelect.value||"1"); }
    async function speak(text){
      return new Promise(async resolve=>{
        if (!("speechSynthesis" in window)) { resolve(); return; }
        if (!voiceReady){
          await warmupVoice({ silentUpdate:true });
          if (!voiceReady){ resolve(); return; }
          setVoiceStatus("語音已就緒，可播放。", true);
        }
        const u = new SpeechSynthesisUtterance(text);
        u.rate = getRate();
        u.lang = selectedVoice?.lang || "zh-TW";
        if (selectedVoice) u.voice = selectedVoice;
        u.onend = resolve; u.onerror = resolve;
        speechSynthesis.speak(u);
      });
    }

    /******** 資料 ********/
    const p4Bank = [
      "優美","山明水秀","美不勝收","風光如畫","風光明媚",
      "桃紅柳綠","風光旖旎","山清水秀","如詩如畫","心曠神怡",
      "水碧山青","（猶如）世外桃源","鳥語花香","景色醉人"
    ];
    const hintMeanings = {
      "優美":"近義：美麗動人",
      "山明水秀":"意涵：山清水淨、景致秀麗",
      "美不勝收":"意涵：美景多到看不完",
      "風光如畫":"意涵：景色像畫一樣美",
      "風光明媚":"意涵：景色鮮明秀麗",
      "桃紅柳綠":"意涵：春景嫣然，花木繁盛",
      "風光旖旎":"意涵：景色柔美動人",
      "山清水秀":"意涵：山色清秀，水質清澈",
      "如詩如畫":"意涵：景色詩畫般優美",
      "心曠神怡":"意涵：身處美景，心情暢快",
      "水碧山青":"意涵：水色碧綠，山色青翠",
      "（猶如）世外桃源":"意涵：恬靜幽美的理想境地",
      "鳥語花香":"意涵：花香四溢，鳥鳴悅耳",
      "景色醉人":"意涵：美景令人陶醉"
    };

    let p4Order = [...p4Bank];
    const p4List = document.getElementById("p4List");
    const shuffleP4 = document.getElementById("shuffleP4");
    const playAllP4 = document.getElementById("playAllP4");
    const checkP4 = document.getElementById("checkP4");
    const showAllAnsP4 = document.getElementById("showAllAnsP4");
    const resetP4 = document.getElementById("resetP4");
    const statusP4 = document.getElementById("statusP4");

    /******** 工具 ********/
    const normalize = str => (str||"").replace(/\s+/g,"").trim();
    function checkSection(listEl, statusEl){
      let allOk = true;
      listEl.querySelectorAll(".item-card").forEach(card=>{
        const input = card.querySelector("input[type='text']");
        if (!input) return;
        const ans = input.dataset.answer || "";
        const ok = normalize(input.value) === normalize(ans);
        input.style.borderColor = ok ? "#16a34a" : "#dc2626";
        input.style.background = ok ? "#ecfdf3" : "#fef2f2";
        allOk = allOk && ok;
      });
      statusEl.textContent = allOk ? "全部正確！" : "已批改，尚有錯誤。";
    }
    function toggleAllAnswers(listEl, show){
      listEl.querySelectorAll(".answer").forEach(a=>{
        a.style.display = show ? "block" : "none";
      });
      listEl.querySelectorAll(".item-card button").forEach(btn=>{
        if (btn.textContent.includes("顯示本句答案")){
          btn.textContent = show ? "🙈 隱藏本句答案" : "👀 顯示本句答案";
        }
      });
    }
    function resetSection(listEl, statusEl){
      speechSynthesis.cancel();
      listEl.querySelectorAll(".item-card").forEach(card=>{
        const input = card.querySelector("input[type='text']");
        if (input){ input.value=""; input.style.borderColor="#cbd5e1"; input.style.background="#fff"; }
        const ans = card.querySelector(".answer");
        if (ans) ans.style.display="none";
        card.querySelectorAll("button").forEach(btn=>{
          if (btn.textContent.includes("顯示本句答案")){
            btn.textContent = "👀 顯示本句答案";
          }
        });
      });
      statusEl.textContent = "尚未批改。";
    }

    /******** 提示生成 ********/
    const pickOne = arr => arr[Math.floor(Math.random()*arr.length)];
    function hintOneOrTwoChars(str){
      const clean = str.replace(/[（）\(\)]/g,"");
      if (!clean) return "";
      const chars = [...clean];
      if (chars.length === 1) return `提示字：${chars[0]}`;
      const n = Math.random() < 0.5 ? 1 : 2;
      if (n === 1) return `提示字：${pickOne(chars)}`;
      if (chars.length <= 2) return `提示字：${chars.join("")}`;
      const i = Math.floor(Math.random()*(chars.length-1));
      const j = (i+1) % chars.length;
      return `提示字：${chars[i]}、${chars[j]}`;
    }
    function buildHint(text){
      const options = [];
      if (hintMeanings[text]) options.push(hintMeanings[text]);      // 近義／意涵
      options.push(hintOneOrTwoChars(text));                         // 1–2 字提示
      const c = text.replace(/[（）\(\)]/g,"");
      if (c.length >= 2) options.push(`首尾：${c[0]}…${c[c.length-1]}（${c.length}字）`);
      return options.length ? pickOne(options) : "提示：—";
    }

    /******** 渲染 ********/
    function renderP4(){
      p4List.innerHTML = "";
      p4Order.forEach((text, idx)=>{
        const hint = buildHint(text);
        const card = document.createElement("div");
        card.className = "item-card";

        const head = document.createElement("div");
        head.className = "item-head";
        const titleBox = document.createElement("div");
        titleBox.innerHTML = `<strong>題目 ${idx+1}</strong> · 形容景色很美`;
        head.appendChild(titleBox);
        const hintBox = document.createElement("div");
        hintBox.className = "hint";
        hintBox.textContent = hint;
        head.appendChild(hintBox);
        card.appendChild(head);

        const row = document.createElement("div");
        row.className = "row";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "請填入完整詞語";
        input.dataset.answer = text;
        row.appendChild(input);

        const playBtn = document.createElement("button");
        playBtn.className = "play";
        playBtn.textContent = "🔊 播答案";
        playBtn.onclick = () => speak(text);
        row.appendChild(playBtn);

        const ansBtn = document.createElement("button");
        ansBtn.textContent = "👀 顯示本句答案";
        row.appendChild(ansBtn);

        card.appendChild(row);

        const ans = document.createElement("div");
        ans.className = "answer";
        ans.textContent = "答案：" + text;
        card.appendChild(ans);

        ansBtn.onclick = () => {
          const shown = ans.style.display === "block";
          ans.style.display = shown ? "none" : "block";
          ansBtn.textContent = shown ? "👀 顯示本句答案" : "🙈 隱藏本句答案";
        };

        p4List.appendChild(card);
      });
    }

    /******** 事件 ********/
    shuffleP4.onclick = () => {
      p4Order = p4Order.sort(()=>Math.random()-0.5);
      renderP4();
      resetSection(p4List, statusP4);
    };
    playAllP4.onclick = async () => {
      speechSynthesis.cancel();
      for (const t of p4Order){
        await speak(t);
        await wait(220);
      }
    };
    checkP4.onclick = () => checkSection(p4List, statusP4);
    showAllAnsP4.onclick = () => {
      const anyHidden = [...p4List.querySelectorAll(".answer")].some(a=>a.style.display!=="block");
      toggleAllAnswers(p4List, anyHidden);
    };
    resetP4.onclick = () => { p4Order=[...p4Bank]; renderP4(); resetSection(p4List, statusP4); };

    voiceInitBtn.onclick = async () => { speechSynthesis.cancel(); await warmupVoice({ silentUpdate:false }); };
    stopBtn.onclick = () => speechSynthesis.cancel();
    document.body.addEventListener("click", () => {}, { once:true });
    if ("speechSynthesis" in window){
      speechSynthesis.addEventListener("voiceschanged", () => {
        cachedVoices = speechSynthesis.getVoices();
        selectedVoice = pickVoice(cachedVoices);
      });
    }

    /* 初始化 */
    renderP4();
  </script>
</body>
</html>
