<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞義理解練習 - 中文科電子教材</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #4caf50;
            --error-color: #f44336;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #quiz-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10    px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .progress {
            text-align: right;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #fff;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
        }

        .option-btn.correct {
            background-color: var(--success-control);
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
        }

        #result-area {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            min-height: 1.5em;
        }

        .score-screen {
            text-align: center;
        }

        .restart-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .restart-btn:hover {
            background-color: #357abd;
        }

        /* 隱藏動畫 */
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="quiz-container">
    <h1>詞義理解練習</h1>
    
    <!-- 答題介面 -->
    <div id="question-screen">
        <div class="progress" id="progress">題目 1 / 10</div>
        <div class="question" id="question-text">載入中...</div>
        <div class="options-grid" id="options-container">
            <!-- 按鈕會由 JS 生成 -->
        </div>
        <div id="result-area"></div>
    </div>

    <!-- 結算介面 -->
    <div id="score-screen" class="hidden">
        <h2>練習結束！</h2>
        <p style="font-size: 1.5rem;">您的得分：<span id="final-score">0</span> / 10</p>
        <button class="restart-btn" onclick="resetQuiz()">重新挑戰</button>
    </div>
</div>

<script>
    // 題目數據庫
    const quizData = [
        { q: "他不應該__________原本擁有的幸福生活。", a: "妄棄", choices: ["妄棄", "放棄", "遺棄", "丟棄"] },
        { q: "看到這幅畫，他心中湧起一股莫名的__________。", a: "悲哀", choices: ["悲哀", "傷痛", "憂愁", "難過"] },
        { q: "對於這位藝術家來說，繪畫就是他的______。", a: "至愛", choices: ["至愛", "愛好", "喜愛", "珍愛"] },
        { q: "當兩顆心靈產生______時，語言便不再重要。", a: "感應", choices: ["感應", "感動", "感覺", "感悟"] },
        { q: "這項新技術能顯著__________生產效率。", a: "提升", choices: ["提升", "提高", "進步", "增強"] },
        { q: "科學家正使用______的儀器進行實驗。", a: "精密", choices: ["精密", "精確", "細緻", "精良"] },
        { q: "製作這件手工藝品的手續非常______。", a: "繁複", choices: ["繁複", "複雜", "繁瑣", "繁重"] },
        { q: "我們應該養成______能源的好習慣。", a: "節省", choices: ["節省", "節制", "節約", "儲存"] },
        { 				q: "我對老師的教導深表______。", a: "感激", choices: ["感激", "感動", "感恩", "感謝"] },
        { q: "災區急需各界的物資______。", a: "支援", choices: ["支援", "支持", "援助", "幫助"] }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let canAnswer = true;

    // 初始化/重置測驗
    function resetQuiz() {
        // 隨機打亂題目順序
        currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        document.getElementById('score-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('result-area').innerText = "";
        
        showQuestion();
    }

    // 顯示題目
    function showQuestion() {
        canAnswer = true;
        const data = currentQuestions[currentIndex];
        
        // 更新進度
        document.getElementById('progress').innerText = `題目 ${currentIndex + 1} / ${currentQuestions.length}`;
        
        // 更新題目文本
        document.getElementById('question-text').innerText = data.q;
        
        // 準備選項並隨機化
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const shuffledChoices = [...data.choices].sort(() => Math.random() - 0.5);
        
        shuffledChoices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = choice;
            btn.onclick = () => checkAnswer(choice, btn);
            optionsContainer.appendChild(btn);
        });
    }

    // 檢查答案
    function checkAnswer(selected, btn) {
        if (!canAnswer) return;
        canAnswer = false;

        const correctAnswer = currentQuestions[currentIndex].a;
        const resultArea = document.getElementById('result-area');

        if (selected === correctAnswer) {
            score++;
            btn.classList.add('correct');
            resultArea.style.color = 'var(--success-color)';
            resultArea.innerText = "答對了！";
        } else {
            btn.classList.add('wrong');
            resultArea.style.color = 'var(--error-color)';
            resultArea.innerText = `可惜，正確答案是「${correctAnswer}」`;
            
            // 強制標示出正確的按鈕
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                if (b.innerText === correctAnswer) b.classList.add('correct');
            });
        }

        // 延遲進入下一題
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                resultArea.innerText = "";
                showQuestion();
            } else {
                showScore();
            }
        }, 1500);
    }

    // 顯示最終分數
    function showScore() {
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }

    // 啟動測驗
    resetQuiz();

</script>

</body>
</html>
